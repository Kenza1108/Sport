<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Members Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">👥 Manage Members</h2>

    <!-- Add Member Form -->
    <div class="card mb-4">
      <div class="card-body">
        <form id="memberForm" class="row g-3">
          <div class="col-md-6">
            <input type="text" id="name" class="form-control" placeholder="Member Name" required>
          </div>
          <div class="col-md-4">
            <input type="text" id="email" class="form-control" placeholder="Email" required>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Member</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Members List -->
    <h4>Current Members:</h4>
    <ul id="memberList" class="list-group"></ul>
  </div>

  <script>
    async function loadMembers() {
      const res = await fetch('/api/members');
      const members = await res.json();
      const list = document.getElementById('memberList');
      list.innerHTML = '';
      members.forEach(m => {
        const li = document.createElement('li');
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `
          ${m.full_name} (${m.email})
          <button class="btn btn-sm btn-danger" onclick="deleteMember('${m.email}')">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    async function deleteMember(email) {
      await fetch('/api/members/' + email, { method: 'DELETE' });
      loadMembers();
    }

    document.getElementById('memberForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      await fetch('/api/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name: name, email: email })
      });
      e.target.reset();
      loadMembers();
    });

    loadMembers();
  </script>
</body>
</html>
