<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Events Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">📅 Manage Events</h2>

    <div class="card mb-4">
      <div class="card-body">
        <form id="eventForm" class="row g-3">
          <div class="col-md-4">
            <input type="text" id="event_name" class="form-control" placeholder="Event Name" required>
          </div>
          <div class="col-md-3">
            <input type="date" id="event_date" class="form-control" required>
          </div>
          <div class="col-md-3">
            <input type="text" id="organizer" class="form-control" placeholder="Organizer">
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Event</button>
          </div>
        </form>
      </div>
    </div>

    <h4>Current Events:</h4>
    <ul id="eventList" class="list-group"></ul>
  </div>

  <script>
    async function loadEvents() {
      const res = await fetch('/api/events');
      const events = await res.json();
      const list = document.getElementById('eventList');
      list.innerHTML = '';
      events.forEach(e => {
        const li = document.createElement('li');
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `
          ${e.event_name} - ${e.event_date} (Organizer: ${e.organizer})
          <button class="btn btn-sm btn-danger" onclick="deleteEvent('${e.event_name}')">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    async function deleteEvent(name) {
      await fetch('/api/events/' + name, { method: 'DELETE' });
      loadEvents();
    }

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('event_name').value;
      const date = document.getElementById('event_date').value;
      const organizer = document.getElementById('organizer').value;
      await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_name: name, event_date: date, organizer })
      });
      e.target.reset();
      loadEvents();
    });

    loadEvents();
  </script>
</body>
</html>
